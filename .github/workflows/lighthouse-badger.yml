name: Lighthouse audit
run-name: Update

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event_name != 'page_build' || github.event.build.status == 'built' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Audit the personal website
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p lighthouse-reports
          npx --yes --package=lighthouse@13.4.0 lighthouse https://biolevol.github.io/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=html --output=json --output-path=lighthouse-reports/mobile
          npx --yes --package=lighthouse@13.4.0 lighthouse https://biolevol.github.io/ --chrome-flags="--headless --no-sandbox" --preset=desktop --only-categories=performance,accessibility,best-practices,seo --output=html --output=json --output-path=lighthouse-reports/desktop
      - name: Save audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Lighthouse reports
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 7
